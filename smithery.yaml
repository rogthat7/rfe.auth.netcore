# Smithery Manifest for RFE.Auth.Netcore MCP Server
# Registry details: https://smithery.ai/

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: "API Key for authenticating with RFE Auth MCP Server"
  config:
    command: "npx"
    args:
      - "-y"
      - "@zerry_jin/swagger-mcp"
      - "--url"
      - "https://rfe-auth-api.onrender.com/swagger/v1/swagger.json"
      - "--header"
      - "X-API-Key: ${config.apiKey}"

metadata:
  name: "rogthat7/rfe-auth-api"
  displayName: "RFE Auth & Identity MCP Server"
  description: "OAuth 2.1 identity provider, OpenIddict token server, and PostgreSQL user administration backend."
  homepage: "https://github.com/rogthat7/rfe.auth.netcore"
  icon: "https://rfe-auth-api.onrender.com/static/logo.png"
  repository: "https://github.com/rogthat7/rfe.auth.netcore"
  license: "MIT"
  tags:
    - authentication
    - oauth2
    - openiddict
    - scalar
    - netcore
