services:
  db:
    image: postgres:17-alpine
    container_name: rfe-auth-db
    environment:
      POSTGRES_DB: rfe_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rfe-auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfe-auth-api
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=rfe_auth_db;Username=postgres;Password=Password123!
    depends_on:
      db:
        condition: service_healthy

  rfe-auth-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: rfe-auth-mcp
    ports:
      - "3000:3000"
    environment:
      - SCALAR_OPENAPI_URL=http://rfe-auth-api:8080/swagger/v1/swagger.json
    depends_on:
      - rfe-auth-api

volumes:
  postgres_mcp_data:
